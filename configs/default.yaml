runtime:
  device: auto

perception:
  screenshot_backend: mss
  monitor_index: 1
  output_directory: outputs/week2

  capture:
    frame_count: 10
    interval_seconds: 0.2
    save_frames: false

  preprocessing:
    grayscale: false
    resize_scale: 1.0
    gaussian_blur: false
    otsu_threshold: false

  ocr:
    engine: paddleocr
    fallback_engine: tesseract
    languages:
      - en
    min_confidence: 0.5
    use_doc_preprocessing: false

  ui_detection:
    enabled: true
    min_area: 100
    max_area_ratio: 0.5
    min_rectangularity: 0.0
    max_candidates: 200
    exclusion_threshold: 0.5

control:
  dry_run: true
  pyautogui_failsafe: true
  action_delay_seconds: 0.2
  countdown_seconds: 3
  move_duration_seconds: 0.3
  drag_duration_seconds: 0.5

output:
  directory: outputs/week2
  save_before_image: true
  save_after_image: true
  save_annotated_image: true
  save_run_summary: true

logging:
  level: INFO
  directory: outputs/week2

dataset:
  name: screenagent
  split: train
  sample_limit: 20
  raw_directory: data/raw
  processed_directory: data/processed

model:
  provider: mock
  model_name: mock-vision-model
  base_url: null
  timeout_seconds: 60
  temperature: 0.0
  max_retries: 1

planning:
  max_steps: 10
  require_structured_output: true
  allow_real_execution: false
