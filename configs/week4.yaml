# Week 4 runtime configuration.
#
# This file does not change Week 2 or Week 3 defaults; it adds the execution
# limits and the observation settings the closed loop needs. Load it with
# `--config configs/week4.yaml`.
#
# Before a real model run, check the server's context window. A full-screen
# screenshot plus the element list measured 7 517 tokens on a 2560x1600 display,
# and Ollama serves 4096 by default, which fails with HTTP 400. Raise it, e.g.
#   OLLAMA_CONTEXT_LENGTH=16384
# before starting the server. The Mock provider is unaffected.

runtime:
  device: auto

perception:
  screenshot_backend: mss
  monitor_index: 1
  output_directory: outputs/week4

  capture:
    frame_count: 1
    interval_seconds: 0.0
    save_frames: false

  preprocessing:
    grayscale: false
    resize_scale: 1.0
    gaussian_blur: false
    otsu_threshold: false

  ocr:
    # Both backends now return whole labels, so this is a per-machine speed
    # choice rather than a correctness one. Mac (1470x956): Tesseract 241 ms
    # against PaddleOCR's 5 525 ms. Windows review machine (2560x1600) is much
    # closer - 738 ms against 982 ms - and configs/default.yaml selects PaddleOCR
    # if you prefer it there. Measured with the engine instance reused.
    engine: tesseract
    fallback_engine: tesseract
    languages:
      - en
    min_confidence: 0.5
    use_doc_preprocessing: false

  ui_detection:
    enabled: true
    min_area: 100
    max_area_ratio: 0.5
    min_rectangularity: 0.0
    max_candidates: 200
    exclusion_threshold: 0.5

control:
  # The runtime passes an explicit dry_run per action; this stays true so that
  # any code path which forgets to decide still does nothing.
  dry_run: true
  pyautogui_failsafe: true
  action_delay_seconds: 0.2
  countdown_seconds: 3
  move_duration_seconds: 0.3
  drag_duration_seconds: 0.5

output:
  directory: outputs/week4
  save_before_image: true
  save_after_image: true
  save_annotated_image: false
  save_run_summary: true

logging:
  level: INFO
  directory: outputs/week4

dataset:
  name: screenagent
  split: train
  sample_limit: 20
  raw_directory: data/raw
  processed_directory: data/processed

model:
  provider: mock
  model_name: mock-vision-model
  base_url: null
  # A planning call carries a 2560x1600 screenshot plus the element list - measured at
  # ~7 500 tokens on the review machine - so it is not comparable to a text call. Warm,
  # that machine answers text in ~0.7 s and image in ~0.9 s, but planning has been
  # measured at 124 s when the model was partly paged out; at 120 s the run died with
  # "planning failed: ModelError: APITimeoutError", which names the transport rather
  # than the cause and reads like a broken endpoint. 300 s leaves room for a slow
  # machine without hiding a genuinely unreachable one; scripts/week4_preflight.py
  # checks the real latency before a run, so a model that cannot answer in budget is
  # reported before anything is captured.
  timeout_seconds: 300
  temperature: 0.0
  max_retries: 0
  # A plan of up to 10 steps, each with 7 fields, needs room. Without this the server's
  # small default cut a real reply off at '"steps":[{"step_id' and the run reported
  # "no JSON object found in the response" - which blames the model for a limit.
  # 2048 was still not enough: qwen2.5vl spends output tokens on a reasoning block before
  # the JSON, and the same run then cut off one step later, mid-"element_id". The client
  # reports finish_reason=length with the partial reply, so the number is easy to tune.
  max_tokens: 8192

planning:
  max_steps: 10
  require_structured_output: true
  allow_real_execution: false

# ── Week 4 additions ────────────────────────────────────────────────
# Named `execution` to match 13.2. There is no max_replans: nothing implements
# re-planning yet, and a knob no code reads is a claim without a mechanism.
execution:
  max_elements: 60
  max_actions: 20
  task_timeout_seconds: 240
  verification_timeout_seconds: 10
  verification_poll_interval_seconds: 0.5
  # Longest single `wait` step the action adapter will accept.
  max_wait_seconds: 5
  # A task with no verifiable success rule is reported blocked rather than
  # treated as complete when the plan runs out.
  require_success_rules: true
